name: FraudShield AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraudshield_user
          POSTGRES_PASSWORD: test_password_secure_123
          POSTGRES_DB: fraudshield_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov bandit flake8

      - name: Security Code Scan (Bandit)
        run: |
          bandit -r backend/app -ll -ii

      - name: Run Test Suite (77 Tests)
        env:
          DATABASE_URL: postgresql://fraudshield_user:test_password_secure_123@localhost:5432/fraudshield_test_db
          SECRET_KEY: test_secret_key_for_continuous_integration_pipeline_only_32_bytes
          ENVIRONMENT: test
        run: |
          pytest security/tests backend/tests -v --cov=backend/app --cov-report=term-missing

  frontend-extension-test:
    name: TypeScript & Frontend Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            admin-dashboard/package-lock.json
            browser-extension/package-lock.json

      - name: Verify Browser Extension TypeScript
        working-directory: ./browser-extension
        run: |
          npm ci
          npx tsc --noEmit

      - name: Verify Admin Dashboard TypeScript
        working-directory: ./admin-dashboard
        run: |
          npm ci
          npx tsc --noEmit

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-extension-test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: fraudshield-backend:test

      - name: Build Dashboard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-dashboard
          push: false
          tags: fraudshield-dashboard:test

